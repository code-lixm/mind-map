<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreedomNode 插件测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    #mindMapContainer {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
    }
    .controls {
      margin-bottom: 20px;
    }
    button {
      padding: 10px 20px;
      margin-right: 10px;
      cursor: pointer;
    }
    .log {
      margin-top: 20px;
      padding: 10px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      max-height: 200px;
      overflow-y: auto;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>FreedomNode 插件测试</h1>

  <div class="controls">
    <button onclick="testPlugin()">1. 测试插件加载</button>
    <button onclick="testConfig()">2. 测试配置</button>
    <button onclick="createFreedomNode()">3. 创建自由节点</button>
    <button onclick="testCommand()">4. 测试命令</button>
    <button onclick="clearLog()">清除日志</button>
  </div>

  <div id="mindMapContainer"></div>

  <div class="log" id="log"></div>

  <script src="./simple-mind-map/dist/simpleMindMap.umd.js"></script>

  <script>
    let mindMap = null

    function log(message, type = 'info') {
      const logDiv = document.getElementById('log')
      const time = new Date().toLocaleTimeString()
      const className = type === 'success' ? 'success' : type === 'error' ? 'error' : ''
      logDiv.innerHTML += `<div class="${className}">[${time}] ${message}</div>`
      logDiv.scrollTop = logDiv.scrollHeight
      console.log(message)
    }

    function clearLog() {
      document.getElementById('log').innerHTML = ''
    }

    function testPlugin() {
      log('=== 测试插件加载 ===')

      // 检查 MindMap 是否存在
      if (typeof simpleMindMap === 'undefined') {
        log('❌ simpleMindMap 未定义', 'error')
        return
      }
      log('✅ simpleMindMap 已加载', 'success')

      // 检查 FreedomNode 插件
      const MindMap = simpleMindMap.default || simpleMindMap
      if (MindMap.pluginNameMap && MindMap.pluginNameMap.freeNode) {
        log('✅ FreedomNode 插件已注册', 'success')
      } else {
        log('❌ FreedomNode 插件未注册', 'error')
        log('已注册插件: ' + Object.keys(MindMap.pluginNameMap || {}).join(', '))
      }

      // 初始化思维导图
      try {
        mindMap = new MindMap({
          el: document.getElementById('mindMapContainer'),
          data: {
            data: { text: '根节点' },
            children: []
          },
          enableFreedomNode: true,
          freedomNodeConfig: {
            dragToBlankConvertSafeDistance: 150,
            snapToTreeDistance: 100,
            dblclickBlankCreateFreedom: true,
            defaultFreedomNodeText: '自由节点',
            enableFreedomNodeDrag: true
          }
        })
        log('✅ MindMap 实例创建成功', 'success')
        window.mindMap = mindMap
      } catch (e) {
        log('❌ MindMap 实例创建失败: ' + e.message, 'error')
      }
    }

    function testConfig() {
      if (!mindMap) {
        log('❌ 请先运行测试 1', 'error')
        return
      }

      log('=== 测试配置 ===')
      log('enableFreedomNode: ' + mindMap.opt.enableFreedomNode)
      log('freedomNodeConfig: ' + JSON.stringify(mindMap.opt.freedomNodeConfig, null, 2))

      if (mindMap.freeNode) {
        log('✅ freeNode 处理器存在', 'success')
        log('freeRootList 长度: ' + (mindMap.freeNode.freeRootList?.length || 0))
      } else {
        log('❌ freeNode 处理器不存在', 'error')
      }
    }

    function createFreedomNode() {
      if (!mindMap) {
        log('❌ 请先运行测试 1', 'error')
        return
      }

      log('=== 创建自由节点 ===')
      try {
        mindMap.execCommand('CREATE_FREEDOM_NODE', {
          text: '测试自由节点 ' + new Date().getTime(),
          position: {
            left: 100 + Math.random() * 200,
            top: 100 + Math.random() * 200
          }
        })
        log('✅ CREATE_FREEDOM_NODE 命令执行成功', 'success')

        setTimeout(() => {
          const count = mindMap.freeNode?.freeRootList?.length || 0
          log('当前自由节点数量: ' + count, count > 0 ? 'success' : 'error')
        }, 100)
      } catch (e) {
        log('❌ 命令执行失败: ' + e.message, 'error')
        console.error(e)
      }
    }

    function testCommand() {
      if (!mindMap) {
        log('❌ 请先运行测试 1', 'error')
        return
      }

      log('=== 测试所有 FreedomNode 命令 ===')

      const commands = [
        'CREATE_FREEDOM_NODE',
        'CONVERT_TO_FREEDOM',
        'ATTACH_FREEDOM_TO_TREE',
        'UPDATE_FREEDOM_NODE_POSITION',
        'DELETE_FREEDOM_NODE'
      ]

      commands.forEach(cmd => {
        const exists = mindMap.command?.commands?.[cmd]
        if (exists) {
          log('✅ ' + cmd + ' 命令已注册', 'success')
        } else {
          log('❌ ' + cmd + ' 命令未注册', 'error')
        }
      })
    }

    // 自动运行测试 1
    window.onload = function() {
      setTimeout(() => {
        log('页面加载完成，自动运行测试...')
        testPlugin()
      }, 500)
    }
  </script>
</body>
</html>
